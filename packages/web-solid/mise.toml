[tasks.dev]
description = "Start the SolidJS development server"
run = "pnpm run dev"

[tasks.build]
description = "Generate the portable static frontend in dist/client"
run = "pnpm run build"

[tasks.typecheck]
description = "Check TypeScript types"
run = "pnpm run build.types"

[tasks.fmt]
description = "Format frontend sources"
run = "pnpm run fmt"

[tasks.fmt-check]
description = "Check frontend formatting"
run = "pnpm run fmt.check"

[tasks.lint]
description = "Run ESLint and Stylelint"
depends = [":lint:eslint", ":lint:style"]

[tasks."lint:eslint"]
description = "Run ESLint"
run = "pnpm run lint"

[tasks."lint:style"]
description = "Run Stylelint"
run = "pnpm run stylelint"

[tasks.test]
description = "Run unit tests and build the static site against fixture content"
run = "pnpm test"

[tasks."check:quick"]
description = "Run frontend formatting, lint, and type checks"
depends = [":fmt-check", ":lint", ":typecheck"]

[tasks.check]
description = "Run the complete frontend quality gate"
depends = [":check:quick", ":test"]
