[tasks.dev]
description = "Start the SolidStart development server"
run = "pnpm run dev"

[tasks.build]
description = "Build the SolidStart frontend"
run = "pnpm run build"

[tasks.typecheck]
description = "Check TypeScript types"
run = "pnpm run build.types"

[tasks.fmt]
description = "Format frontend sources"
run = "pnpm run fmt"

[tasks.fmt-check]
description = "Check frontend formatting"
run = "pnpm run fmt.check"

[tasks.lint]
description = "Run ESLint and Stylelint"
depends = [":lint:eslint", ":lint:style"]

[tasks."lint:eslint"]
description = "Run ESLint"
run = "pnpm run lint"

[tasks."lint:style"]
description = "Run Stylelint"
run = "pnpm run stylelint"

[tasks.test]
description = "Build the frontend, then run unit and SSR tests"
run = [{ task = ":build" }, "pnpm run test.unit", "pnpm run test.ssr"]

[tasks."check:quick"]
description = "Run frontend formatting, lint, and type checks"
depends = [":fmt-check", ":lint", ":typecheck"]

[tasks.check]
description = "Run the complete frontend quality gate"
depends = [":check:quick", ":test"]

[tasks.deploy]
description = "Build, upload the frontend/Lambda, and invalidate CloudFront"
usage = '''
arg "<stage>" { choices "dev" "stg" "prod" }
'''
run = [
  { task = ":build", env = { STAGE_NAME = "{{usage.stage}}" } },
  'STAGE_NAME="${usage_stage?}" ./scripts/deploy-s3.sh',
  'STAGE_NAME="${usage_stage?}" ./scripts/deploy-lambda.sh',
  'STAGE_NAME="${usage_stage?}" ./scripts/invalidate.sh',
]
