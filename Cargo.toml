[workspace]
resolver = "3"
members = [
    "crates/web-blog-sdk",
    "crates/web-lambda-logs-reporter",
]

[workspace.dependencies]
# HTTP Client
reqwest = { version = "0.13", default-features = true, features = [
    "gzip",
    "brotli",
] }

# AWS SDK
aws-config = "1.8.8"
aws-sdk-ssm = "1.96.0"
aws-sdk-sns = "1.95.0"

# AWS Lambda
lambda_http = "1.0"
lambda_runtime = { version = "1.0" }
aws_lambda_events = { version = "1.1.2" }

# Ser/De
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.145"

# Asynchronous runtime
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

# General Utils
bytes = "1.11.1"
futures = "0.3.31"
dotenvy = "0.15.7"
thiserror = "2.0.17"

# Notion
n2a2ui = "0.4.0"
n2a2ui-a2ui = "0.3.0"
notionrs = "0.28.0"
notionrs_types = "0.21.0"

# Time
time = { version = "0.3.47", features = ["formatting"] }
