name: Rust CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

jobs:
  test:
    name: Rust unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Clone Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: jdx/mise-action@v4
        with:
          version: "2026.9.9"
          install: false

      - name: Install native Rust toolchain
        run: mise run setup:rust

      - uses: Swatinem/rust-cache@v2

      - name: Run unit tests (Notion integration tests are separate)
        run: mise run rust:test
