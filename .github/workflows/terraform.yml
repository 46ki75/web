name: Terraform CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

jobs:
  check:
    name: Terraform quality gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: jdx/mise-action@v4
        with:
          version: "2026.9.9"
          install_args: "terraform"

      - name: Run Terraform quality gates
        run: mise run //terraform/...:check
