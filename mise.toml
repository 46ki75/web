min_version = "2026.9.9"
monorepo_root = true

[monorepo]
config_roots = ["packages/*", "crates/*", "terraform/*"]

[tools]
node = "24.21.0"
awscli = "2.36.46"
terraform = "1.16.2"
zig = "0.16.0"
# Linux autodetection also matches Python wheels; select standalone CLI archives.
cargo-lambda = { version = "1.9.2", matching = "cargo-lambda-v" }

[tool_alias]
cargo-lambda = "github:cargo-lambda/cargo-lambda"

[tool_config]
locked = true

[task_config]
shell = "bash -euo pipefail -c"

[settings]
idiomatic_version_file_enable_tools = ["pnpm"]
# Rust belongs to rustup; package.json owns pnpm, including its checksum.
disable_tools = ["rust", "npm:pnpm"]
auto_install = false
lockfile_platforms = ["macos-arm64", "linux-x64", "linux-arm64"]

[tasks.setup]
description = "Prepare the native Rust toolchain and locked Node dependencies"
depends = [":setup:rust", ":setup:node"]

[tasks."setup:rust"]
description = "Install the toolchain, components, and targets from rust-toolchain.toml"
run = "rustup toolchain install --no-self-update"

[tasks."setup:node"]
description = "Install locked pnpm workspace dependencies"
run = "pnpm install --frozen-lockfile"

[tasks.fmt]
description = "Format all active packages"
depends = ["//...:fmt"]

[tasks.fmt-check]
description = "Check formatting in all active packages"
depends = ["//...:fmt-check"]

[tasks.lint]
description = "Run all configured package linters"
depends = ["//...:lint"]

[tasks.test]
description = "Run all ordinary package test suites"
depends = ["//...:test"]

[tasks."check:quick"]
description = "Run fast feedback checks in all active packages"
depends = ["//...:check:quick"]

[tasks.check]
description = "Run the complete project-wide quality gate"
depends = ["//...:check"]
