[tasks.fmt]
description = "Format AWS Terraform configuration"
run = "terraform fmt -recursive ."

[tasks.fmt-check]
description = "Check AWS Terraform formatting"
run = "terraform fmt -check -recursive ."

[tasks."check:quick"]
description = "Check AWS Terraform formatting"
depends = [":fmt-check"]

[tasks.test]
description = "Test static deployment and CloudFront routing locally"
run = [
  "node --test assets/staticSite.test.mjs",
  "python3 -B -m unittest discover -s ../../scripts/tests -p test_deploy_static_aws.py",
]

[tasks.check]
description = "Run the AWS Terraform quality gate"
depends = [":check:quick", ":test"]
