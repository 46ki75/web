[tasks.fmt]
description = "Format AWS Terraform configuration"
run = "terraform fmt ."

[tasks.fmt-check]
description = "Check AWS Terraform formatting"
run = "terraform fmt -check ."

[tasks."check:quick"]
description = "Check AWS Terraform formatting"
depends = [":fmt-check"]

[tasks.check]
description = "Run the AWS Terraform quality gate"
depends = [":check:quick"]
